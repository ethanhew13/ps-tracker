name: PS This Month tracker

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 mins (GitHub may delay runs a bit)
  workflow_dispatch:                # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: ps-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pypdf (reads the lobbyist PDFs)
        run: pip install pypdf

      - name: Run regional tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ps_tmop_tracker.py

      - name: Run page watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python ps_page_watch.py

      - name: Run feed watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python ps_feed_watch.py

      - name: Run discovery watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ps_discover.py

      - name: Save state
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "update state" && git push)
